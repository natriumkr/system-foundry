<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TagSync</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">SHELF PRICE, POS PRICE, ONE TRUTH.</p><h1>TagSync</h1><p>진열 가격표와 POS 가격 차이를 찾아 고객 혼선과 정산 손실을 줄이세요.</p></div><span class="local">로컬 저장 · 외부 전송 없음</span></header><section class="stats"><article><small>점검 상품</small><b id="productCount">0</b></article><article><small>미처리 불일치</small><b id="mismatchCount">0</b></article><article><small>잠재 차액</small><b id="exposure">₩0</b></article><article><small>수정 완료</small><b id="resolvedCount">0</b></article></section><section class="layout"><aside><h2>가격 대조 등록</h2><form id="tagForm"><label>상품명<input name="product" required minlength="2" maxlength="60" placeholder="예: 유기농 우유 900ml"></label><label>SKU<input name="sku" required minlength="2" maxlength="30" pattern="[A-Za-z0-9-]{2,30}" placeholder="예: MILK-900"></label><div class="row"><label>진열 가격<input type="number" name="shelf" min="0" max="100000000" step="1" required></label><label>POS 가격<input type="number" name="pos" min="0" max="100000000" step="1" required></label></div><label>영향 수량<input type="number" name="units" min="1" max="100000" step="1" value="20" required></label><button type="submit" class="primary">가격 대조 저장</button><p id="message"></p></form><p class="note">상품명과 내부 SKU만 입력하세요. 고객 개인정보·결제정보는 저장하지 않습니다.</p></aside><section><div class="sectionhead"><div><p class="eyebrow">MISMATCH QUEUE</p><h2>수정 우선순위</h2></div><span>잠재 차액 우선</span></div><div id="queue" class="queue"></div></section></section></main><script src="engine.js"></script><script src="app.js"></script></body></html>
