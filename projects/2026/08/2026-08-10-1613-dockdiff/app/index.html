<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="납품 수량 차이와 회수 금액을 관리하는 로컬 우선 업무 도구"><title>DockDiff</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">RECEIVE. CHECK. RECOVER.</p><h1>DockDiff</h1><p>주문과 납품의 차이를 잡고, 이의 제기 기한 전에 회수하세요.</p></div><span class="local">로컬 저장 · 외부 전송 없음</span></header><section class="stats"><article><small>납품 기록</small><b id="deliveryCount">0</b></article><article><small>미처리 차이</small><b id="openCount">0</b></article><article><small>기한 초과</small><b id="expiredCount">0</b></article><article><small>회수 대상액</small><b id="recovery">₩0</b></article></section><section class="layout"><aside><h2>납품 대조 등록</h2><form id="deliveryForm"><label>거래처<input name="supplier" required minlength="2" maxlength="40" placeholder="예: 한빛 식자재"></label><label>품목<input name="item" required minlength="2" maxlength="50" placeholder="예: 원두 1kg"></label><label>발주 번호<input name="invoice" required minlength="2" maxlength="30" placeholder="예: PO-2408-31"></label><label>납품일<input type="date" name="deliveryDate" required></label><div class="row"><label>주문 수량<input type="number" name="ordered" min="1" max="100000" value="10" required></label><label>실수령 수량<input type="number" name="received" min="0" max="100000" value="10" required></label></div><div class="row"><label>개당 단가<input type="number" name="unitPrice" min="0" max="10000000" value="1000" required></label><label>이의 기한(일)<input type="number" name="claimDays" min="1" max="30" value="7" required></label></div><button type="submit" class="primary">대조 기록 저장</button><p id="message" aria-live="polite"></p></form><p class="note">계약상 실제 이의 제기 기한은 거래처 약관과 발주서를 확인하세요.</p></aside><section><div class="sectionhead"><div><p class="eyebrow">DISCREPANCY QUEUE</p><h2>회수가 필요한 납품</h2></div><span>기준일 2026.08.10</span></div><div id="queue" class="queue"></div></section></section></main><script src="engine.js"></script><script src="app.js"></script></body></html>
