<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="가정용 유지관리 주기와 비용을 관리하는 로컬 우선 도구"><title>CareCycle</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">HOME CARE, ON TIME</p><h1>CareCycle</h1><p>집 안 관리 주기를 놓치지 말고, 오늘 할 일을 먼저 보세요.</p></div><span class="local">로컬 저장 · 외부 전송 없음</span></header><section class="stats"><article><small>관리 항목</small><b id="totalCount">0</b></article><article><small>긴급·지연</small><b id="urgentCount">0</b></article><article><small>연 예상 비용</small><b id="annualCost">₩0</b></article><article><small>30일 내 예정</small><b id="dueThisMonth">0</b></article></section><section class="layout"><aside><h2>관리 항목 추가</h2><form id="taskForm"><label>항목명<input name="name" required minlength="2" maxlength="40" placeholder="예: 정수기 필터 교체"></label><label>위치<input name="location" required minlength="2" maxlength="30" placeholder="예: 주방"></label><label>카테고리<select name="category"><option>공기·필터</option><option>청소·위생</option><option>가전 관리</option><option>취미 장비</option></select></label><div class="row"><label>최근 완료일<input type="date" name="lastDone" required></label><label>주기(일)<input type="number" name="intervalDays" min="1" max="730" value="30" required></label></div><label>회당 예상 비용<input type="number" name="cost" min="0" max="5000000" value="0" required></label><button type="submit" class="primary">일정 등록</button><p id="message" aria-live="polite"></p></form><p class="note">안전 관련 기기는 제조사 안내와 전문가 점검 주기를 우선하세요.</p></aside><section><div class="sectionhead"><div><p class="eyebrow">PRIORITY QUEUE</p><h2>다가오는 관리 일정</h2></div><span>기준일 2026.08.09</span></div><div id="queue" class="queue"></div></section></section></main><script src="engine.js"></script><script src="app.js"></script></body></html>
