<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="교대 인수인계 누락과 미해결 업무를 관리하는 로컬 우선 시스템"><title>ShiftSeal</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">HAND OVER. CLOSE CLEAR.</p><h1>ShiftSeal</h1><p>퇴근 전 미해결 업무를 봉인하고, 다음 교대가 바로 움직이게 하세요.</p></div><span class="local">로컬 저장 · 외부 전송 없음</span></header><section class="stats"><article><small>전체 인계 항목</small><b id="totalCount">0</b></article><article><small>미완료</small><b id="openCount">0</b></article><article><small>우선 확인</small><b id="criticalCount">0</b></article><article><small>교대 완료율</small><b id="completion">0%</b></article></section><section class="layout"><aside><h2>인계 항목 등록</h2><form id="handoverForm"><label>업무 구역<input name="area" required minlength="2" maxlength="30" placeholder="예: 카운터"></label><label>인계 항목<input name="task" required minlength="2" maxlength="70" placeholder="예: 예약 고객 선결제 확인"></label><label>담당자<input name="owner" required minlength="2" maxlength="30" placeholder="예: 민서"></label><div class="row"><label>완료 예정<input type="time" name="dueTime" required></label><label>중요도<input type="number" name="severity" min="1" max="3" value="2" required></label></div><button type="submit" class="primary">인계 항목 저장</button><p id="message" aria-live="polite"></p></form><p class="note">고객 개인정보, 비밀번호, 결제정보는 입력하지 마세요. 이 MVP는 내부 체크리스트이며 안전·회계 규정을 대신하지 않습니다.</p></aside><section><div class="sectionhead"><div><p class="eyebrow">HANDOVER QUEUE</p><h2>다음 교대가 확인할 일</h2></div><span>기준 2026.08.11 16:00</span></div><div id="queue" class="queue"></div></section></section></main><script src="engine.js"></script><script src="app.js"></script></body></html>
