<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="3D 프린팅 부품의 출력판 적합성과 한 판 생산량을 계산하는 로컬 도구"><title>PlateCheck</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">MEASURE. ROTATE. PRINT.</p><h1>PlateCheck</h1><p>슬라이서 전에 치수를 확인하고, 한 판에 몇 개 들어가는지 계산하세요.</p></div><span class="local">로컬 저장 · 외부 전송 없음</span></header><section class="stats"><article><small>배치 분석</small><b id="jobCount">0</b></article><article><small>필요 부품</small><b id="partCount">0</b></article><article><small>예상 출력판</small><b id="plateCount">0</b></article><article><small>배치 불가</small><b id="noFitCount">0</b></article></section><section class="layout"><aside><h2>부품 배치 분석</h2><form id="plateForm"><label>부품명<input name="name" required minlength="2" maxlength="50" placeholder="예: 센서 브래킷"></label><div class="row"><label>부품 폭(mm)<input type="number" name="partW" min="1" max="1000" step="0.1" required></label><label>부품 깊이(mm)<input type="number" name="partD" min="1" max="1000" step="0.1" required></label></div><div class="row"><label>출력판 폭(mm)<input type="number" name="bedW" min="20" max="1000" step="0.1" value="250" required></label><label>출력판 깊이(mm)<input type="number" name="bedD" min="20" max="1000" step="0.1" value="210" required></label></div><div class="row"><label>부품 간격(mm)<input type="number" name="gap" min="0" max="30" step="0.1" value="5" required></label><label>필요 수량<input type="number" name="needed" min="1" max="10000" value="1" required></label></div><button type="submit" class="primary">배치 계산 저장</button><p id="message" aria-live="polite"></p></form><p class="note">직사각형 바운딩박스 기반 추정치입니다. 실제 출력 전 슬라이서에서 브림·서포트·헤드 간섭과 유효 출력 영역을 확인하세요.</p></aside><section><div class="sectionhead"><div><p class="eyebrow">PLATE PLAN</p><h2>출력판 적합성 분석</h2></div><span>0°와 90° 격자 배치 비교</span></div><div id="queue" class="queue"></div></section></section></main><script src="engine.js"></script><script src="app.js"></script></body></html>
