<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="취소 슬롯을 대기 고객과 빠르게 연결하는 로컬 우선 업무 도구"><title>SlotSignal · 빈 시간을 매출로</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="styles.css"></head><body><main><header><a class="brand" href="#"><span>SS</span> SlotSignal</a><div id="todayLabel" class="date"></div></header>
<section class="hero"><div><p class="eyebrow">WAITLIST RECOVERY DESK</p><h1>갑자기 빈 예약,<br><em>가장 맞는 고객부터.</em></h1><p>취소 슬롯과 대기 고객의 서비스·시간대를 비교해 연락 순서를 자동 정렬합니다.</p></div><div class="hero-card"><small>지금 바로 연락</small><strong id="heroPriority">0명</strong><span>적합도 90점 이상</span></div></section>
<section class="stats"><article><small>대기 고객</small><b id="waitingCount">0</b><span>연락 가능</span></article><article><small>빈 슬롯</small><b id="openCount">0</b><span>예약 가능</span></article><article class="accent"><small>회수 가능 매출</small><b id="revenueAtRisk">₩0</b><span>열린 슬롯 합계</span></article></section>
<section class="workspace"><div class="panel queue-panel"><div class="section-head"><div><p class="eyebrow">CONTACT QUEUE</p><h2>추천 연락 순서</h2></div><span>서비스 + 시간대 + 대기일</span></div><div id="queue" class="queue"></div></div>
<aside><form id="slotForm" class="panel form"><p class="eyebrow">OPEN SLOT</p><h2>빈 슬롯 등록</h2><label>서비스<select name="service"><option>컷</option><option>컬러</option><option>클리닉</option><option>네일</option></select></label><div class="split"><label>날짜<input name="date" type="date" required></label><label>시간<input name="time" type="time" required></label></div><label>예상 매출<input name="price" type="number" min="1000" max="2000000" value="35000" required></label><button class="primary">슬롯 등록</button><p id="slotMessage" class="message"></p></form>
<form id="customerForm" class="panel form"><p class="eyebrow">WAITLIST</p><h2>대기 고객 등록</h2><label>고객명<input name="name" maxlength="30" placeholder="예: 한유나" required></label><div class="split"><label>서비스<select name="service"><option>컷</option><option>컬러</option><option>클리닉</option><option>네일</option></select></label><label>가능 시간<select name="availability"><option value="morning">오전</option><option value="afternoon">오후</option><option value="evening">저녁</option></select></label></div><label>등록일<input name="joined" type="date" required></label><button class="primary secondary">대기 등록</button><p id="message" class="message"></p></form></aside></section><footer>데이터는 이 브라우저에만 저장됩니다 · 외부 API 없음</footer></main><script src="engine.js"></script><script src="app.js"></script></body></html>
