<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RestockRun · 품절 전에 움직이기</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="styles.css"></head><body><main><header><b><span>RR</span> RestockRun</b><small>로컬 소모품 운영 보드</small></header><section class="hero"><div><p class="eyebrow">SUPPLY RUNWAY</p><h1>재료가 끊기기 전에,<br><em>주문부터 달린다.</em></h1><p>현재 수량과 일평균 사용량으로 품절 위험과 재주문 예산을 계산합니다.</p></div><div class="hero-card"><small>즉시 재주문</small><strong id="critical">0</strong><span>기준 수량 이하</span></div></section><section class="stats"><article><small>관리 품목</small><b id="count">0</b><span>활성 소모품</span></article><article><small>현재 재고 가치</small><b id="value">₩0</b><span>보유 수량 × 단가</span></article><article class="accent"><small>재주문 예산</small><b id="budget">₩0</b><span>권장 주문 합계</span></article></section><section class="workspace"><div class="panel"><div class="section-head"><div><p class="eyebrow">RESTOCK QUEUE</p><h2>품절 위험 순서</h2></div><span>재고 런웨이 + 주문 비용</span></div><div id="queue"></div></div><aside class="panel"><p class="eyebrow">ADD SUPPLY</p><h2>소모품 등록</h2><form id="itemForm"><label>품목명<input name="name" maxlength="40" placeholder="예: PETG 투명 필라멘트" required></label><div class="split"><label>카테고리<select name="category"><option>인쇄재료</option><option>3D프린팅</option><option>포장재</option><option>촬영소모품</option></select></label><label>단위<input name="unit" maxlength="12" value="개" required></label></div><div class="split"><label>현재 수량<input name="stock" type="number" min="0" step="0.01" value="10" required></label><label>일평균 사용량<input name="dailyUse" type="number" min="0.01" step="0.01" value="1" required></label></div><div class="split"><label>재주문 기준<input name="reorderPoint" type="number" min="0" step="0.01" value="5" required></label><label>단가<input name="unitCost" type="number" min="1" value="5000" required></label></div><button>품목 등록</button><p id="message"></p></form></aside></section><footer>데이터는 이 브라우저에만 저장됩니다 · 외부 API 없음</footer></main><script src="engine.js"></script><script src="app.js"></script></body></html>
