<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PickupDesk — 수리 완료 물품 수령 관리</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="styles.css"></head><body><main><header><div class="brand"><span class="logo">P</span><strong>PickupDesk</strong></div><div class="local">● 이 브라우저에만 저장</div></header><section class="hero"><div><p class="eyebrow">READY-TO-PICKUP CONTROL</p><h1>수리 완료가<br><em>매출 완료</em>가 되도록.</h1><p class="lead">매장을 차지하는 완료 물품과 미수금을 한눈에 정리하고, 오늘 먼저 연락할 고객을 찾으세요.</p></div><div class="hero-card"><span>오늘의 우선순위</span><b id="heroPriority">0건</b><small>약속 경과 또는 오늘 수령</small></div></section><section class="stats"><article><span>수령 대기</span><b id="readyCount">0</b><small>건</small></article><article class="hot"><span>약속 경과</span><b id="overdueCount">0</b><small>건</small></article><article><span>회수 예정</span><b id="outstanding">₩0</b></article><article><span>보관료 누적</span><b id="storageAccrued">₩0</b></article></section><section class="workspace"><div class="queue-panel"><div class="section-title"><div><p class="eyebrow">CONTACT QUEUE</p><h2>수령 연락 큐</h2></div><span id="todayLabel"></span></div><div id="queue" class="queue"></div></div><aside><p class="eyebrow">NEW READY ITEM</p><h2>수리 완료 등록</h2><form id="jobForm"><label>접수번호<input name="ticket" maxlength="30" required placeholder="R-104"></label><label>고객 별칭<input name="customer" maxlength="40" required placeholder="박○○"></label><label class="wide">물품<input name="item" maxlength="70" required placeholder="노트북 · 배터리 교체"></label><label>수리 완료일<input type="date" name="readyDate" required></label><label>수령 약속일<input type="date" name="promisedDate" required></label><label>미수금<input type="number" name="balance" min="0" max="100000000" step="1000" required value="60000"></label><label>일 보관료<input type="number" name="dailyFee" min="0" max="1000000" step="500" required value="2000"></label><button type="submit">수령 대기 등록 <span>→</span></button><p id="message" role="status"></p></form><p class="privacy">연락처 대신 고객 별칭만 입력하세요. 외부 전송 기능은 없습니다.</p></aside></section></main><script src="engine.js"></script><script src="app.js"></script></body></html>
