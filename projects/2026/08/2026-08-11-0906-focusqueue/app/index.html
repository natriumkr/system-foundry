<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="마감일과 예상 시간을 바탕으로 오늘의 학습 순서를 만드는 로컬 우선 도구"><title>FocusQueue</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">PLAN LESS. START CLEAR.</p><h1>FocusQueue</h1><p>마감과 소요시간을 계산해, 오늘 먼저 끝낼 공부를 정하세요.</p></div><span class="local">로컬 저장 · 외부 전송 없음</span></header><section class="stats"><article><small>남은 할 일</small><b id="taskCount">0</b></article><article><small>마감 임박</small><b id="urgentCount">0</b></article><article><small>남은 학습량</small><b id="minuteCount">0분</b></article><article><small>오늘 계획</small><b id="planCount">0분</b></article></section><section class="layout"><aside><h2>학습 할 일 등록</h2><form id="taskForm"><label>과목<input name="subject" required minlength="2" maxlength="30" placeholder="예: 수학"></label><label>할 일<input name="title" required minlength="2" maxlength="60" placeholder="예: 확률 문제 20개"></label><label>마감일<input type="date" name="dueDate" required></label><div class="row"><label>예상 시간(분)<input type="number" name="minutes" min="10" max="600" value="30" required></label><label>중요도<input type="number" name="importance" min="1" max="5" value="3" required></label></div><button type="submit" class="primary">할 일 저장</button><p id="message" aria-live="polite"></p></form><div class="budget"><label for="budget">오늘 사용 가능한 시간 <b id="budgetValue">120분</b></label><input id="budget" type="range" min="30" max="360" step="30" value="120"></div><p class="note">점수는 마감·중요도·예상 시간을 기준으로 한 참고 순서입니다. 충분한 휴식과 학교 일정을 함께 고려하세요.</p></aside><section><div class="sectionhead"><div><p class="eyebrow">TODAY'S FOCUS</p><h2>우선순위 학습 큐</h2></div><span>기준일 2026.08.11</span></div><div id="queue" class="queue"></div></section></section></main><script src="engine.js"></script><script src="app.js"></script></body></html>
