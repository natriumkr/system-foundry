<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BoxBridge</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">PACK. FIND. SETTLE.</p><h1>BoxBridge</h1><p>어느 상자에 무엇이 있는지 기록하고, 새집 정리를 빠르게 끝내세요.</p></div><span class="local">로컬 저장 · 외부 전송 없음</span></header><section class="stats"><article><small>전체 상자</small><b id="boxCount">0</b></article><article><small>깨짐주의 미정리</small><b id="fragileCount">0</b></article><article><small>남은 상자</small><b id="remainingCount">0</b></article><article><small>정리 진행률</small><b id="progress">0%</b></article></section><section class="layout"><aside><h2>상자 등록</h2><form id="boxForm"><label>상자 코드<input name="code" required minlength="2" maxlength="20" pattern="[A-Za-z0-9-]{2,20}" placeholder="예: KIT-02"></label><label>도착 방<select name="room" required><option value="">선택</option><option>거실</option><option>주방</option><option>침실</option><option>서재</option><option>욕실</option><option>창고</option><option>기타</option></select></label><label>내용물<input name="contents" required minlength="2" maxlength="160" placeholder="예: 접시, 수저, 행주"></label><label class="check"><input type="checkbox" name="fragile"> 깨짐주의 상자</label><button type="submit" class="primary">상자 기록 저장</button><p id="message"></p></form><p class="note">현금, 신분증, 귀중품 위치는 기록하지 마세요. 데이터는 현재 브라우저에만 보관됩니다.</p></aside><section><div class="sectionhead"><div><p class="eyebrow">BOX FINDER</p><h2>상자 찾기와 정리 현황</h2></div><span id="resultCount">0개 표시</span></div><label>코드·방·내용물 검색<input id="search" maxlength="60" placeholder="예: 케이블 또는 주방"></label><div id="queue" class="queue"></div></section></section></main><script src="engine.js"></script><script src="app.js"></script></body></html>
