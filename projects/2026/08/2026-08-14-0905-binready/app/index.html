<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BinReady</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">FIND PARTS. START BUILDING.</p><h1>BinReady</h1><p>전자부품의 위치와 프로젝트 필요 수량을 한 화면에서 확인하세요.</p></div><span class="local">로컬 저장 · 외부 전송 없음</span></header><section class="stats"><article><small>등록 부품</small><b id="partCount">0</b></article><article><small>총 재고</small><b id="stockCount">0</b></article><article><small>부족 부품</small><b id="shortageCount">0</b></article><article><small>준비 완료</small><b id="readyCount">0</b></article></section><section class="layout"><aside><h2>부품 등록</h2><form id="partForm"><label>부품명<input name="part" maxlength="60" required placeholder="예: ESP32 개발보드"></label><label>부품 코드<input name="code" maxlength="24" required placeholder="예: ESP32-D1"></label><div class="row"><label>분류<select name="category" required><option value="">선택</option><option>보드</option><option>센서</option><option>구동</option><option>수동소자</option><option>커넥터</option><option>기타</option></select></label><label>보관함<input name="bin" maxlength="24" required placeholder="예: A-01"></label></div><div class="row"><label>현재 수량<input name="stock" type="number" min="0" max="100000" required value="0"></label><label>필요 수량<input name="needed" type="number" min="0" max="100000" required value="1"></label></div><button class="primary" type="submit">부품 저장</button><p id="message"></p><p class="note">보관함에는 개인정보를 적지 마세요. 기록은 이 브라우저에만 저장됩니다.</p></form></aside><div><div class="sectionhead"><div><p class="eyebrow">PROJECT READINESS</p><h2>부족 부품 우선순위</h2></div><span>부족 수량 우선</span></div><label class="searchbar">부품·코드·보관함 검색<input id="search" type="search" placeholder="예: D-03 또는 ESP32"></label><div id="queue" class="queue"></div></div></section></main><script src="engine.js"></script><script src="app.js"></script></body></html>
