<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BatchBalance</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">BAKE. COUNT. IMPROVE.</p><h1>BatchBalance</h1><p>계획과 실제 생산량의 차이를 잡고, 폐기 비용을 줄이세요.</p></div><span class="local">로컬 저장 · 외부 전송 없음</span></header><section class="stats"><article><small>생산 배치</small><b id="batchCount">0</b></article><article><small>우선 확인</small><b id="attentionCount">0</b></article><article><small>평균 수율</small><b id="yieldRate">0%</b></article><article><small>미검토 폐기비</small><b id="lossCost">₩0</b></article></section><section class="layout"><aside><h2>생산 배치 등록</h2><form id="batchForm"><label>제품명<input name="product" required minlength="2" maxlength="50" placeholder="예: 버터 스콘"></label><label>배치 번호<input name="batch" required minlength="2" maxlength="30" placeholder="예: SC-0812-E"></label><div class="row"><label>계획 수량<input type="number" name="planned" value="40" min="1" max="100000" step="1" required></label><label>완제품 수량<input type="number" name="good" value="36" min="0" max="100000" step="1" required></label></div><div class="row"><label>폐기 수량<input type="number" name="waste" value="4" min="0" max="100000" step="1" required></label><label>개당 원가<input type="number" name="unitCost" value="800" min="0" max="1000000" step="1" required></label></div><button type="submit" class="primary">배치 기록 저장</button><p id="message"></p></form><p class="note">수율 기록은 개선 참고용입니다. 식품 안전·보관 기준은 사업장 규정을 따르세요.</p></aside><section><div class="sectionhead"><div><p class="eyebrow">YIELD QUEUE</p><h2>손실 확인이 필요한 배치</h2></div><span>낮은 수율 우선</span></div><div id="queue" class="queue"></div></section></section></main><script src="engine.js"></script><script src="app.js"></script></body></html>
