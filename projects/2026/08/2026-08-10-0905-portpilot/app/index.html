<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="기기와 충전기의 포트·출력 호환성을 관리하는 로컬 우선 도구"><title>PortPilot</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">PACK LESS, POWER EVERYTHING</p><h1>PortPilot</h1><p>내 기기에 맞는 충전기와 여행용 최소 구성을 한눈에 확인하세요.</p></div><span class="local">로컬 저장 · 외부 전송 없음</span></header><section class="stats"><article><small>등록 기기</small><b id="deviceCount">0</b></article><article><small>보유 충전기</small><b id="chargerCount">0</b></article><article><small>호환 없음</small><b id="uncoveredCount">0</b></article><article><small>추천 여행 충전기</small><b id="kitCount">0</b></article></section><section class="kit"><p class="eyebrow">TRAVEL KIT</p><div id="kit"></div></section><section class="layout"><aside><h2>장비 추가</h2><form id="gearForm"><label>유형<select name="kind"><option value="device">충전할 기기</option><option value="charger">보유 충전기</option></select></label><label>장비명<input name="name" required minlength="2" maxlength="40" placeholder="예: 태블릿"></label><label>포트<select name="port"><option>USB-C</option><option>USB-A</option><option>Lightning</option><option>DC 원형</option></select></label><label>필요 또는 최대 출력(W)<input type="number" name="watts" min="1" max="300" value="20" required></label><label class="check"><input type="checkbox" name="travel"> 여행 목록에 포함</label><button type="submit" class="primary">장비 등록</button><p id="message" aria-live="polite"></p></form><p class="note">제조사 정격과 케이블 허용 전력을 확인하세요. 이 도구는 전기 안전 인증을 대신하지 않습니다.</p></aside><section><div class="sectionhead"><div><p class="eyebrow">COMPATIBILITY</p><h2>기기별 충전 호환성</h2></div><span>출력 충족 기준</span></div><div id="queue" class="queue"></div></section></section></main><script src="engine.js"></script><script src="app.js"></script></body></html>
