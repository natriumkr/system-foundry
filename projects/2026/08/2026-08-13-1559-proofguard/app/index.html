<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProofGuard</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">APPROVE BEFORE PRODUCE.</p><h1>ProofGuard</h1><p>최종 시안 승인을 놓치지 말고, 승인 전 제작 위험을 숫자로 관리하세요.</p></div><span class="local">로컬 저장 · 외부 전송 없음</span></header><section class="stats"><article><small>전체 승인 건</small><b id="jobCount">0</b></article><article><small>기한 주의</small><b id="attentionCount">0</b></article><article><small>미승인 노출액</small><b id="exposure">₩0</b></article><article><small>승인 완료</small><b id="approvedCount">0</b></article></section><section class="layout"><aside><h2>시안 승인 건 등록</h2><form id="proofForm"><label>고객명<input name="client" required minlength="2" maxlength="60" placeholder="예: 카페 모노"></label><label>작업명<input name="job" required minlength="2" maxlength="80" placeholder="예: 메뉴판 최종 시안"></label><label>승인 마감일<input type="date" name="deadline" required></label><label>재작업 노출액<input type="number" name="exposure" min="0" max="100000000" step="1" value="200000" required></label><button type="submit" class="primary">승인 건 저장</button><p id="message"></p></form><p class="note">고객 개인정보나 결제정보는 입력하지 마세요. 실제 제작 투입 전 서면 승인을 별도로 보관하세요.</p></aside><section><div class="sectionhead"><div><p class="eyebrow">APPROVAL QUEUE</p><h2>제작 전 확인이 필요한 시안</h2></div><span>마감 위험 우선</span></div><div id="queue" class="queue"></div></section></section></main><script src="engine.js"></script><script src="app.js"></script></body></html>
