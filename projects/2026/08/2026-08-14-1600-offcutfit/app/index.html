<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OffcutFit</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">USE THE PIECE BEFORE THE SHEET.</p><h1>OffcutFit</h1><p>자투리 소재를 새 작업과 대조해 재구매와 폐기를 줄이세요.</p></div><span class="local">로컬 저장 · 외부 전송 없음</span></header><section class="stats"><article><small>등록 조각</small><b id="pieceCount">0</b></article><article><small>가용 면적</small><b id="areaCount">0㎡</b></article><article><small>잔존 가치</small><b id="valueCount">₩0</b></article><article><small>작업 적합</small><b id="matchCount">0</b></article></section><section class="layout"><aside><h2>자투리 등록</h2><form id="offcutForm"><label>소재<select name="material" required><option value="">선택</option><option>투명 아크릴</option><option>검정 아크릴</option><option>자작 합판</option><option>검정 포맥스</option><option>알루미늄 복합판</option></select></label><div class="row"><label>소재 코드<input name="code" required maxlength="24" placeholder="ACR-003"></label><label>보관 위치<input name="location" required maxlength="30" placeholder="RACK-A3"></label></div><div class="row"><label>가로(mm)<input name="width" type="number" min="1" max="1000000" required></label><label>세로(mm)<input name="height" type="number" min="1" max="1000000" required></label></div><div class="row"><label>두께(mm)<input name="thickness" type="number" min="1" max="1000000" required></label><label>㎡당 단가(원)<input name="unitPrice" type="number" min="1" max="1000000" required></label></div><button class="primary" type="submit">자투리 저장</button><p id="message"></p><p class="note">소재 실측값을 입력하세요. 개인정보나 출입 코드는 기록하지 마세요.</p></form></aside><div><div class="sectionhead"><div><p class="eyebrow">JOB FIT MATCHING</p><h2>작업 적합 자투리</h2></div><span>회전 배치 포함</span></div><form id="fitForm" class="fitbar"><label>작업 소재<select name="material"><option>투명 아크릴</option><option>검정 아크릴</option><option>자작 합판</option><option>검정 포맥스</option><option>알루미늄 복합판</option></select></label><label>가로<input name="width" type="number" value="250" min="1" required></label><label>세로<input name="height" type="number" value="180" min="1" required></label><label>두께<input name="thickness" type="number" value="3" min="1" required></label><button class="primary" type="submit">적합 계산</button></form><p id="fitMessage" class="note"></p><div id="queue" class="queue"></div></div></section></main><script src="engine.js"></script><script src="app.js"></script></body></html>
