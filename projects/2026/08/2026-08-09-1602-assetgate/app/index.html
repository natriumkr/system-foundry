<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="고객 자료 수신과 프로젝트 착수 준비도를 관리하는 업무 도구"><title>AssetGate</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">CLIENT INTAKE CONTROL</p><h1>AssetGate</h1><p>고객 자료가 다 모일 때까지, 착수 지연을 숫자로 관리하세요.</p></div><span class="local">로컬 저장 · 외부 전송 없음</span></header><section class="stats"><article><small>진행 프로젝트</small><b id="projectCount">0</b></article><article><small>대기 자료</small><b id="waitingCount">0</b></article><article><small>마감 초과</small><b id="overdueCount">0</b></article><article><small>잠재 지연 합계</small><b id="delayDays">0일</b></article></section><section class="layout"><aside><h2>자료 요청 추가</h2><form id="assetForm"><label>프로젝트<input name="project" required minlength="2" maxlength="40" placeholder="예: 쇼핑몰 리뉴얼"></label><label>고객명<input name="client" required minlength="2" maxlength="40" placeholder="예: 파도상점"></label><label>요청 자료<input name="item" required minlength="2" maxlength="50" placeholder="예: 제품 사진 원본"></label><label>카테고리<select name="category"><option>브랜드 자료</option><option>콘텐츠</option><option>접근 권한</option><option>계약·행정</option></select></label><div class="row"><label>요청 마감일<input type="date" name="dueDate" required></label><label>예상 지연(일)<input type="number" name="delayDays" min="0" max="60" value="1" required></label></div><button type="submit" class="primary">요청 등록</button><p id="message" aria-live="polite"></p></form><p class="note">실제 비밀번호나 인증키는 입력하지 말고, 권한 부여 여부만 기록하세요.</p></aside><section><div class="sectionhead"><div><p class="eyebrow">BLOCKER QUEUE</p><h2>착수를 막는 자료</h2></div><span>기준일 2026.08.09</span></div><div id="queue" class="queue"></div></section></section></main><script src="engine.js"></script><script src="app.js"></script></body></html>
