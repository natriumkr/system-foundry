<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="보증 만료일과 청구 증빙을 관리하는 로컬 우선 개인 도구"><title>ProofPocket · 보증을 놓치지 않게</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="styles.css"></head><body><main><header><a class="brand"><span>PP</span> ProofPocket</a><div id="todayLabel"></div></header><section class="hero"><div><p class="eyebrow">WARRANTY CONTROL</p><h1>영수증은 찾고,<br><em>보증기간은 지킨다.</em></h1><p>구매품의 보증 만료일과 청구 증빙을 한 화면에서 관리하세요.</p></div><div class="hero-card"><small>증빙 보완 필요</small><strong id="missingProof">0</strong><span>영수증 또는 시리얼</span></div></section><section class="stats"><article><small>등록 제품</small><b id="totalCount">0</b><span>관리 중</span></article><article><small>30일 이내 만료</small><b id="urgentCount">0</b><span>우선 확인</span></article><article class="accent"><small>보증 보호 가치</small><b id="protectedValue">₩0</b><span>유효 제품 구매가</span></article></section><section class="workspace"><div class="panel"><div class="section-head"><div><p class="eyebrow">EXPIRY QUEUE</p><h2>보증 만료 순서</h2></div><span>만료일 + 청구 준비도</span></div><div id="queue" class="queue"></div></div><aside class="panel"><p class="eyebrow">ADD PURCHASE</p><h2>구매품 등록</h2><form id="itemForm"><label>제품명<input name="name" maxlength="40" placeholder="예: 노이즈캔슬링 헤드폰" required></label><label>구매처<input name="store" maxlength="40" placeholder="예: 공식 온라인몰" required></label><div class="split"><label>카테고리<select name="category"><option>전자기기</option><option>가전</option><option>취미용품</option><option>생활용품</option></select></label><label>구매가<input name="price" type="number" min="1000" max="50000000" value="120000" required></label></div><div class="split"><label>구매일<input name="purchaseDate" type="date" required></label><label>보증 개월<input name="warrantyMonths" type="number" min="1" max="120" value="12" required></label></div><div class="proof"><label><input type="checkbox" name="hasReceipt"> 영수증 보유</label><label><input type="checkbox" name="hasSerial"> 시리얼 기록</label></div><button class="primary">제품 등록</button><p id="message"></p></form></aside></section><footer>데이터는 이 브라우저에만 저장됩니다 · 실제 영수증 파일은 업로드하지 않습니다</footer></main><script src="engine.js"></script><script src="app.js"></script></body></html>
